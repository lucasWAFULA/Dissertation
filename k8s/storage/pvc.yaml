apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-data-pvc
  namespace: market-pulse
spec:
  # GKE premium SSD-backed storage class for fast model loading
  storageClassName: premium-rwo
  accessModes:
    - ReadWriteOnce   # Single writer; inference pods share via subPath mounts
  resources:
    requests:
      storage: 5Gi    # Covers model artifacts (527MB XGB) + CSV data files
