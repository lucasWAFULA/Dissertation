steps:
  # Build Streamlit image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/food-price-app:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/food-price-app:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/food-price-app:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=.
      - --image=gcr.io/$PROJECT_ID/food-price-app:$SHORT_SHA
      - --location=us-central1
      - --config=cloud-run-config.yaml

images:
  - 'gcr.io/$PROJECT_ID/food-price-app:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/food-price-app:latest'

# Build timeout
timeout: 3600s

# Use substitutions for project-specific variables
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'food-price-anomaly'

options:
  machineType: 'N1_HIGHCPU_8'
