steps:
  # Build Streamlit image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/food-price-app:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/food-price-app:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy $_SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/food-price-app:latest \
          --platform managed \
          --region $_REGION \
          --allow-unauthenticated \
          --memory 2Gi \
          --cpu 2 \
          --timeout 300 \
          --max-instances 10

images:
  - 'gcr.io/$PROJECT_ID/food-price-app:latest'

# Build timeout
timeout: 3600s

# Use substitutions for project-specific variables
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'food-price-anomaly'

options:
  machineType: 'N1_HIGHCPU_8'
