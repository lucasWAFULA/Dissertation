name: Production Deploy → GKE

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: marketpulseai-496112
  GKE_REGION: us-central1
  GKE_CLUSTER: market-pulse-cluster
  AR_REGISTRY: us-central1-docker.pkg.dev/marketpulseai-496112/market-pulse
  INFERENCE_IMAGE: us-central1-docker.pkg.dev/marketpulseai-496112/market-pulse/inference
  FRONTEND_IMAGE: us-central1-docker.pkg.dev/marketpulseai-496112/market-pulse/frontend
  K8S_NAMESPACE: market-pulse

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Python tests with coverage
  # ────────────────────────────────────────────────────────────────────────────
  test-python:
    name: 🧪 Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          FIREBASE_PROJECT_ID: "marketpulseai-496112"
          DATABASE_URL: "sqlite:////tmp/test-quota.db"
          QUOTA_FREE_DAILY: "100"
          QUOTA_PRO_DAILY: "5000"
          QUOTA_ENTERPRISE_DAILY: "999999"
        run: |
          pytest tests/ \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --ignore=tests/test_auth_integration.py \
            --tb=short \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend build validation
  # ────────────────────────────────────────────────────────────────────────────
  lint-frontend:
    name: 🔨 Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (validates all imports & types)
        env:
          VITE_FIREBASE_PROJECT_ID: marketpulseai-496112
          VITE_FIREBASE_AUTH_DOMAIN: marketpulseai-496112.firebaseapp.com
          VITE_API_BASE_URL: https://api.marketpulse.services
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build and push Docker images
  # ────────────────────────────────────────────────────────────────────────────
  build-images:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-python, lint-frontend]
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # ── Build inference image ──────────────────────────────────────────────
      - name: Build inference image
        run: |
          docker build \
            --tag ${{ env.INFERENCE_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.INFERENCE_IMAGE }}:latest \
            --cache-from ${{ env.INFERENCE_IMAGE }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
        env:
          DOCKER_BUILDKIT: "1"

      - name: Push inference image
        run: |
          docker push ${{ env.INFERENCE_IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.INFERENCE_IMAGE }}:latest

      # ── Build frontend image ───────────────────────────────────────────────
      - name: Build frontend image
        run: |
          docker build \
            --tag ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.FRONTEND_IMAGE }}:latest \
            --cache-from ${{ env.FRONTEND_IMAGE }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg VITE_FIREBASE_PROJECT_ID=marketpulseai-496112 \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=marketpulseai-496112.firebaseapp.com \
            --build-arg VITE_API_BASE_URL=https://api.marketpulse.services \
            --build-arg VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }} \
            --build-arg VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }} \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
            ./frontend
        env:
          DOCKER_BUILDKIT: "1"

      - name: Push frontend image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Security scan
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Scan inference image for vulnerabilities
        run: |
          gcloud artifacts docker images scan \
            ${{ env.INFERENCE_IMAGE }}:${{ needs.build-images.outputs.image-tag }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="json" \
            --remote \
          | tee inference-scan-results.json
          echo "## Inference Image Scan" >> $GITHUB_STEP_SUMMARY
          cat inference-scan-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          vulns = data.get('response', {}).get('discovery', [{}])[0]
          print(f'Critical: {vulns.get(\"criticalCount\", 0)}')
          print(f'High: {vulns.get(\"highCount\", 0)}')
          print(f'Medium: {vulns.get(\"mediumCount\", 0)}')
          " >> $GITHUB_STEP_SUMMARY

      - name: Scan frontend image for vulnerabilities
        run: |
          gcloud artifacts docker images scan \
            ${{ env.FRONTEND_IMAGE }}:${{ needs.build-images.outputs.image-tag }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="json" \
            --remote \
          | tee frontend-scan-results.json

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: "*-scan-results.json"
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Deploy to GKE
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Create namespace (idempotent)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/monitoring/namespace.yaml

      - name: Apply base manifests
        run: |
          # Storage
          kubectl apply -f k8s/storage/pvc.yaml

          # ConfigMaps
          kubectl apply -f k8s/inference/configmap.yaml

          # Services (must exist before deployments reference them)
          kubectl apply -f k8s/inference/service.yaml
          kubectl apply -f k8s/frontend/service.yaml

          # Ingress resources (cert + backend config + ingress)
          kubectl apply -f k8s/ingress/managed-cert.yaml
          kubectl apply -f k8s/ingress/backend-config.yaml
          kubectl apply -f k8s/ingress/ingress.yaml

          # Monitoring stack
          kubectl apply -f k8s/monitoring/prometheus.yaml
          kubectl apply -f k8s/monitoring/grafana.yaml

      - name: Update image tags and deploy
        run: |
          # Patch deployments to SHA-tagged image for reproducibility
          kubectl set image deployment/inference \
            inference=${{ env.INFERENCE_IMAGE }}:${{ needs.build-images.outputs.image-tag }} \
            -n ${{ env.K8S_NAMESPACE }} || true

          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ needs.build-images.outputs.image-tag }} \
            -n ${{ env.K8S_NAMESPACE }} || true

      - name: Apply full deployment manifests
        run: |
          # Deployments
          kubectl apply -f k8s/inference/deployment.yaml
          kubectl apply -f k8s/frontend/deployment.yaml

          # HPA (must come after deployment exists)
          kubectl apply -f k8s/inference/hpa.yaml

          # CronJob for live data ingestion
          kubectl apply -f k8s/cronjob/live-ingest.yaml

      - name: Wait for inference rollout
        run: |
          kubectl rollout status deployment/inference \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s
        continue-on-error: true
        id: inference-rollout

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s
        continue-on-error: true
        id: frontend-rollout

      - name: Rollback on failure
        if: steps.inference-rollout.outcome == 'failure' || steps.frontend-rollout.outcome == 'failure'
        run: |
          echo "❌ Rollout failed — initiating rollback..."
          kubectl rollout undo deployment/inference -n ${{ env.K8S_NAMESPACE }} || true
          kubectl rollout undo deployment/frontend -n ${{ env.K8S_NAMESPACE }} || true
          kubectl rollout status deployment/inference -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true
          kubectl rollout status deployment/frontend  -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true
          echo "Rollback complete"
          exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6: Verify deployment health
  # ────────────────────────────────────────────────────────────────────────────
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for load balancer propagation
        run: sleep 30

      - name: Health check — API
        run: |
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              https://api.marketpulse.services/health || echo "000")
            echo "Attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ API health check passed"
              exit 0
            fi
            sleep 15
          done
          echo "❌ API health check failed after 5 attempts"
          exit 1

      - name: Health check — App
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://app.marketpulse.services/ || echo "000")
          echo "Frontend HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend returned $HTTP_STATUS (may still be provisioning cert)"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 7: Deployment summary
  # ────────────────────────────────────────────────────────────────────────────
  notify:
    name: 📣 Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: always()
    steps:
      - name: Write GitHub Step Summary
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          VERIFY_STATUS="${{ needs.verify.result }}"
          IMAGE_TAG="${{ github.sha }}"

          echo "## 🚀 Market Pulse AI — Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${IMAGE_TAG:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | market-pulse-cluster (us-central1) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | market-pulse |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy** | $DEPLOY_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Verify** | $VERIFY_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- App: https://app.marketpulse.services" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://api.marketpulse.services/health" >> $GITHUB_STEP_SUMMARY
          echo "- API Docs: https://api.marketpulse.services/docs" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: https://admin.marketpulse.services" >> $GITHUB_STEP_SUMMARY
