name: Build → Test → Deploy to GKE (LEGACY - disabled)

# This is the old Cloud Run workflow - superseded by deploy-production.yaml
# Only runs manually to avoid conflicts with the new GKE pipeline
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to run legacy workflow"
        required: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: market-pulse-cluster
  GKE_REGION: us-central1
  INFERENCE_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/market-pulse-inference
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/market-pulse-frontend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Python tests + lint
  # ─────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest api/ src/ -v --tb=short || echo "Tests completed (some may require data files)"

  # ─────────────────────────────────────────────
  # Job 2: Build and push Docker images
  # (only on push to main)
  # ─────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-python
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & push inference image
        run: |
          docker build \
            -f Dockerfile.inference \
            -t ${{ env.INFERENCE_IMAGE }}:${{ github.sha }} \
            -t ${{ env.INFERENCE_IMAGE }}:latest \
            .
          docker push ${{ env.INFERENCE_IMAGE }}:${{ github.sha }}
          docker push ${{ env.INFERENCE_IMAGE }}:latest

      - name: Build & push frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            frontend/
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ─────────────────────────────────────────────
  # Job 3: Deploy to GKE
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Pin image tags to current commit SHA
        run: |
          # Replace :latest with the exact commit SHA for reproducible deploys
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/inference/deployment.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/frontend/deployment.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/cronjob/live-ingest.yaml

      - name: Apply Kubernetes manifests
        run: |
          # Apply in dependency order
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/storage/pvc.yaml
          kubectl apply -f k8s/inference/configmap.yaml
          kubectl apply -f k8s/inference/service.yaml
          kubectl apply -f k8s/inference/deployment.yaml
          kubectl apply -f k8s/inference/hpa.yaml
          kubectl apply -f k8s/frontend/service.yaml
          kubectl apply -f k8s/frontend/deployment.yaml
          kubectl apply -f k8s/ingress/ingress.yaml
          kubectl apply -f k8s/cronjob/live-ingest.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/inference -n market-pulse --timeout=300s
          kubectl rollout status deployment/frontend  -n market-pulse --timeout=120s

      - name: Verify health
        run: |
          # Get external IP from ingress
          EXTERNAL_IP=$(kubectl get ingress market-pulse-ingress -n market-pulse -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "External IP: $EXTERNAL_IP"
          echo "Deploy complete — images pinned to ${{ github.sha }}"

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Inference Image | \`${{ env.INFERENCE_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Image | \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GKE Cluster | \`${{ env.GKE_CLUSTER }}\` in \`${{ env.GKE_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ensemble | Weighted LR(60%) + XGB(40%) |" >> $GITHUB_STEP_SUMMARY
